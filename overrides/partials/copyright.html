<div class="md-copyright" style="text-align: left; line-height: 1.6;">
  {% if config.copyright %}
    <div class="md-copyright__highlight" style="margin-bottom: 0.8rem; font-weight: bold;">
      {{ config.copyright }}
    </div>
  {% endif %}

  <!-- Строка ссылок на музыкальные платформы с выравниванием слева -->
  <div class="custom-social-inline" style="font-size: 0.85rem; color: var(--md-typeset-color);">
    <a href="https://music.apple.com/us/artist/julia-tilinga/1752864835" target="_blank" rel="noopener">🅐 Apple Music</a> | 
    <a href="https://open.spotify.com/artist/29Z2YEcTujgk9DreH3sRmC" target="_blank" rel="noopener">🅢 Spotify</a> | 
    <a href="https://music.yandex.com/artist/22514951" target="_blank" rel="noopener">🅨 Yandex Music</a>
  </div>
</div>

<style>
  /* Стилизация ссылок */
  .custom-social-inline a {
    color: inherit;
    text-decoration: none;
    transition: color 0.2s;
    display: inline-block;
  }
  /* Подсветка при наведении */
  .custom-social-inline a:hover {
    color: var(--md-accent-fg-color);
    text-decoration: underline;
  }
</style>
